<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Dashboard - Activity 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #212529; color: white; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-val { font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar p-3">
                <h4>Activity 1</h4>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="#">Logs</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="#">Settings</a></li>
                </ul>
            </nav>

            <main class="col-md-10 p-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Server Overview</h1>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card p-3 text-center">
                            <div class="text-muted text-uppercase small">CPU Usage</div>
                            <div class="stat-val text-primary">12%</div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card p-3 text-center">
                            <div class="text-muted text-uppercase small">Memory</div>
                            <div class="stat-val text-success">1.2 GB</div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card p-3 text-center">
                            <div class="text-muted text-uppercase small">Uptime</div>
                            <div class="stat-val text-warning">48h</div>
                        </div>
                    </div>
                </div>

                <div class="card p-4 mt-2">
                    <h5>Recent Activity</h5>
                    <table class="table table-hover mt-3">
                        <thead class="table-light">
                            <tr>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Last Check</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Apache2</td>
                                <td><span class="badge bg-success">Active</span></td>
                                <td>Just now</td>
                            </tr>
                            <tr>
                                <td>MySQL</td>
                                <td><span class="badge bg-success">Active</span></td>
                                <td>5 mins ago</td>
                            </tr>
                            <tr>
                                <td>SSH</td>
                                <td><span class="badge bg-success">Active</span></td>
                                <td>10 mins ago</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
